<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion Tickets Combustible - Despacho</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d6efd" />
    <link rel="stylesheet" href="/css/estilos.css" />
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <main class="contenedor-despacho">
        <header class="cabecera-despacho">
            <h1>Despacho de Combustible</h1>
            <button id="boton-cerrar-sesion" type="button">Cerrar Sesion</button>
        </header>

        <section id="seccion-escaner">
            <button id="boton-escanear" type="button">Escanear Codigo QR</button>
            <div id="lector-qr"></div>
        </section>

        <section id="seccion-ticket" hidden>
            <h2>Datos del Ticket</h2>
            <div id="detalle-ticket"></div>
            <p id="mensaje-validacion" class="mensaje-error"></p>

            <form id="formulario-despacho" hidden>
                <label for="tanque">Tanque</label>
                <select id="tanque" required></select>

                <label for="galones">Galones Despachados</label>
                <input type="number" id="galones" step="0.01" min="0.01" required />

                <label for="estacion">Estacion</label>
                <input type="text" id="estacion" required value="Estacion Central" />

                <label for="observaciones">Observaciones (opcional)</label>
                <textarea id="observaciones" rows="3"></textarea>

                <button type="submit">Registrar Despacho</button>
            </form>

            <p id="mensaje-resultado"></p>
            <button id="boton-escanear-otro" type="button" hidden>Escanear Otro Ticket</button>
        </section>
    </main>

    <script src="/js/registro-sw.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/despacho.js"></script>
</body>
</html>
